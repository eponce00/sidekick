<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SideKick</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- SideKick sends this page's Content-Security-Policy as a header: nothing loads from elsewhere. -->
    <meta name="referrer" content="no-referrer" />
    <!-- The desktop tokens' --app-bg, so the phone's status bar matches the page. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efefef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SideKick" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/companion.webmanifest" />
    <link rel="apple-touch-icon" href="/companion-icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/companion/main.tsx"></script>
  </body>
</html>
