<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- The React sandbox's policy, plus the inline scripts an HTML artifact is made of. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*"
    />
  </head>
  <body>
    <script type="module" src="/src/html-sandbox-main.ts"></script>
  </body>
</html>
