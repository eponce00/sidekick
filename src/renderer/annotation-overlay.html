<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SideKick annotations</title>
    <!-- SideKick's own page over a live web page while the user marks it. It loads nothing from elsewhere. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; frame-src 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/annotationOverlay/main.tsx"></script>
  </body>
</html>
