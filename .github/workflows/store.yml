name: Microsoft Store package

# Builds the MSIX package a maintainer submits in Partner Center. The Store signs what it
# distributes, so this package is never attached to a GitHub release. It runs once the
# repository has the identity Partner Center assigned when the app name was reserved.
on:
  push:
    tags:
      - 'v*'
  # Certification takes days and releases come faster, so a tag that finds a submission still on
  # its way to the Store leaves it alone. A daily run then submits the latest release once it can.
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:
    inputs:
      submit:
        description: Submit this build for certification, as a version tag does
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time, so two runs never race to replace the same Partner Center submission.
concurrency:
  group: store
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the Store submission
    if: vars.SIDEKICK_STORE_IDENTITY_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      submit: ${{ steps.plan.outputs.submit }}
    steps:
      # Secrets cannot appear in a condition, so this step reads them and reports what to do.
      # Submitting replaces the pending submission, which would restart its certification, so a
      # build is submitted only when no submission is on its way to the Store and the build is
      # newer than what the Store has.
      - name: Decide what to build and whether to submit it
        id: plan
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SUBMIT_INPUT: ${{ inputs.submit }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.SIDEKICK_STORE_PRODUCT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          # A scheduled run builds the latest release; any other run builds the commit that started it.
          if ($env:EVENT -eq 'schedule') {
            $tag = gh release view --repo $env:REPOSITORY --json tagName --jq .tagName
            $ref = "refs/tags/$tag"
          } else {
            $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { '' }
            $ref = $env:GITHUB_SHA
          }
          $manifest = gh api -H 'Accept: application/vnd.github.raw' "repos/$env:REPOSITORY/contents/package.json?ref=$ref" | ConvertFrom-Json
          $version = [version]"$($manifest.version).0"
          $requested = $env:EVENT -in 'push', 'schedule' -or $env:SUBMIT_INPUT -eq 'true'

          $access = [bool]$env:CLIENT_SECRET -and [bool]$env:PRODUCT_ID
          $submit = $false
          if ($access) {
            # An unreachable Partner Center skips the submission but still builds the package.
            try {
              $token = (Invoke-RestMethod -Method Post "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/token" -Body @{
                grant_type = 'client_credentials'
                client_id = $env:CLIENT_ID
                client_secret = $env:CLIENT_SECRET
                resource = 'https://manage.devcenter.microsoft.com'
              }).access_token
              Write-Host "::add-mask::$token"
              $headers = @{ Authorization = "Bearer $token" }
              $api = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:PRODUCT_ID"
              $packageVersion = {
                param($id)
                (Invoke-RestMethod "$api/submissions/$id" -Headers $headers).applicationPackages |
                  Where-Object { $_.fileStatus -ne 'PendingDelete' -and $_.version } |
                  ForEach-Object { [version]$_.version } | Sort-Object -Descending | Select-Object -First 1
              }
              $app = Invoke-RestMethod $api -Headers $headers
              $published = if ($app.lastPublishedApplicationSubmission) { & $packageVersion $app.lastPublishedApplicationSubmission.id }
              Write-Host "Published in the Store: $published"
              $busy = $false
              if ($app.pendingApplicationSubmission) {
                $id = $app.pendingApplicationSubmission.id
                $status = (Invoke-RestMethod "$api/submissions/$id/status" -Headers $headers).status
                $pending = & $packageVersion $id
                Write-Host "Pending submission: $pending, $status"
                # A failed or uncommitted submission may be replaced; any other is still in progress.
                $busy = $status -in 'CommitStarted', 'PreProcessing', 'Certification', 'Release', 'PendingPublication', 'Publishing'
                if ($busy -and $requested) {
                  $wait = if ($status -eq 'PendingPublication') { 'waits for Publish now in Partner Center' } else { "is in $status" }
                  Write-Host "::notice title=Store submission::$pending $wait, so $version is not submitted; a later run submits the newest release."
                }
              }
              $submit = $requested -and -not $busy -and (-not $published -or $version -gt $published)
            } catch {
              Write-Host "::warning title=Store submission::Could not read the Store submissions: $($_.Exception.Message)"
            }
          }
          Write-Host "Building $ref ($version); Partner Center API access: $access; submitting: $submit"
          # A scheduled run that has nothing to submit builds nothing.
          $build = $env:EVENT -ne 'schedule' -or $submit
          "ref=$ref" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "build=$($build.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "submit=$($submit.ToString().ToLower())" >> $env:GITHUB_OUTPUT

  store:
    name: Build Microsoft Store package
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      # npm retries a request that fails before its response arrives, but not a connection reset
      # partway through a download, which fails the whole install. npm ci starts again from an
      # empty node_modules, so one more attempt rides out a transient registry error.
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci
      - name: Retry installing dependencies
        if: steps.install.outcome == 'failure'
        run: npm ci
      - name: Verify stable tag matches package version
        if: needs.plan.outputs.tag != ''
        shell: pwsh
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:TAG -ne "v$version") {
            throw "Expected tag v$version, received $env:TAG"
          }
      - name: Build the Store package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SIDEKICK_STORE_IDENTITY_NAME: ${{ vars.SIDEKICK_STORE_IDENTITY_NAME }}
          SIDEKICK_STORE_PUBLISHER: ${{ vars.SIDEKICK_STORE_PUBLISHER }}
          SIDEKICK_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.SIDEKICK_STORE_PUBLISHER_DISPLAY_NAME }}
          SIDEKICK_STORE_DISPLAY_NAME: ${{ vars.SIDEKICK_STORE_DISPLAY_NAME }}
        run: npm run build:store
      - name: Verify the package identity
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem dist -File -Filter 'SideKick-*-windows-x64-store.appx')
          if ($packages.Count -ne 1) { throw 'Expected exactly one Store package.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $entry = $zip.GetEntry('AppxManifest.xml')
            $reader = New-Object IO.StreamReader($entry.Open())
            [xml]$manifest = $reader.ReadToEnd()
            $reader.Close()
          } finally {
            $zip.Dispose()
          }
          if ($manifest.Package.Identity.Name -ne $env:IDENTITY) { throw 'Package identity does not match' }
          if ($manifest.Package.Identity.Publisher -ne $env:PUBLISHER) { throw 'Publisher does not match' }
          Write-Host "Built $($packages[0].Name) for $env:IDENTITY."
        env:
          IDENTITY: ${{ vars.SIDEKICK_STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.SIDEKICK_STORE_PUBLISHER }}
      - name: Upload the Store package
        uses: actions/upload-artifact@v7
        with:
          name: SideKick-Microsoft-Store
          path: dist/SideKick-*-windows-x64-store.appx
          if-no-files-found: error
          retention-days: 30
      - name: Set up the Microsoft Store Developer CLI
        if: needs.plan.outputs.submit == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Submit the package for certification
        if: needs.plan.outputs.submit == 'true'
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.SIDEKICK_STORE_PRODUCT_ID }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Could not sign in to Partner Center.' }
          $package = @(Get-ChildItem dist -File -Filter 'SideKick-*-windows-x64-store.appx')[0]
          # Creates a submission from the last published one with the new package, commits it, and
          # waits for Partner Center to process it, reporting any error. Editing the draft between
          # upload and commit left the package unprocessed, so the publishing option (publish as
          # soon as certified) is carried over from the last published submission instead.
          # The CLI publishes a package file by itself when the path it is given ends in .msix, the
          # same format as .appx, and uploads every package in that file's folder, so the one
          # package goes alone into a folder of its own.
          $upload = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'store-upload')
          $msix = Join-Path $upload.FullName "$($package.BaseName).msix"
          Copy-Item -LiteralPath $package.FullName -Destination $msix
          msstore publish $msix --appId $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw 'The Store submission failed.' }
          msstore submission status $env:PRODUCT_ID
