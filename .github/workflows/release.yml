name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    # Signing waits for a maintainer to approve the request in SignPath.
    timeout-minutes: 100
    env:
      # Tagged releases are signed once the SignPath Foundation project is configured.
      SIGN_WINDOWS: ${{ github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != '' }}

    steps:
      - uses: actions/checkout@v7

      # Scanning every file npm, Vitest and electron-builder write slows this job several times
      # over. The runner is discarded afterwards; the artifacts are checked and attested below.
      - name: Stop Defender scanning this throwaway runner
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:LOCALAPPDATA -ErrorAction SilentlyContinue

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - run: npm ci
      - name: Verify stable tag matches package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tagged releases require stable semver; received $version"
          }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Expected tag v$version, received $env:GITHUB_REF_NAME"
          }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run test:docs
      - run: npm test
      - run: npm run test:release
      - name: Build Windows community artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - run: npm run test:e2e:runtime
        env:
          SIDEKICK_E2E_EXECUTABLE: dist/win-unpacked/SideKick.exe
      - run: npm run test:native-browser-smoke
      - run: npm run test:native-browser-fixtures
      - run: npm run validate:package -- dist/win-unpacked/resources
      - run: npm run smoke:packaged:windows
      - name: Upload the unsigned installer for signing
        if: env.SIGN_WINDOWS == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: SideKick-Windows-x64-unsigned
          path: dist/SideKick-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installer through SignPath Foundation
        if: env.SIGN_WINDOWS == 'true'
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed
      - name: Replace the installer with its signed copy
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem dist-signed -File -Recurse -Filter 'SideKick-*-windows-x64-setup.exe')
          if ($signed.Count -ne 1) { throw 'Expected exactly one signed Windows installer.' }
          Copy-Item -LiteralPath $signed[0].FullName -Destination (Join-Path dist $signed[0].Name) -Force
      - name: Verify the installer signature
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File -Filter 'SideKick-*-windows-x64-setup.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one Windows NSIS installer.' }
          $signature = Get-AuthenticodeSignature -FilePath $files[0].FullName
          if ($env:SIGN_WINDOWS -eq 'true') {
            if ($signature.Status -ne 'Valid') {
              throw "Expected a valid Authenticode signature, received: $($signature.Status)"
            }
            if ($signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
              throw "Unexpected signer: $($signature.SignerCertificate.Subject)"
            }
            Write-Host "Verified the SignPath Foundation signature on $($files[0].Name)."
          } elseif ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned community installer, received: $($signature.Status)"
          } else {
            Write-Host "Verified that $($files[0].Name) is unsigned; SignPath signing is not configured."
          }
      - name: Validate Windows community installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          npm run validate:release -- --version $version --platform windows dist

      - name: Upload Windows community artifact
        uses: actions/upload-artifact@v7
        with:
          name: SideKick-Windows-x64
          path: dist/SideKick-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS arm64
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - run: npm ci
      - name: Verify stable tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tagged releases require stable semver; received $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Expected tag v$version, received $GITHUB_REF_NAME"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run test:docs
      - run: npm test
      - run: npm run test:release
      - name: Build ad-hoc signed macOS community artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:mac
      - run: npm run test:e2e:runtime
        env:
          SIDEKICK_E2E_EXECUTABLE: dist/mac-arm64/SideKick.app/Contents/MacOS/SideKick
      - run: npm run test:native-browser-smoke
      - run: npm run test:native-browser-fixtures
      - run: npm run validate:package -- dist/mac-arm64/SideKick.app/Contents/Resources
      - run: npm run smoke:packaged:macos
      - name: Verify the application uses only an ad-hoc signature
        shell: bash
        run: |
          app_path='dist/mac-arm64/SideKick.app'
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_details="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          grep -q 'Signature=adhoc' <<<"$signature_details"
          if grep -q '^Authority=' <<<"$signature_details"; then
            echo "::error::Community builds must not depend on a paid Apple signing identity."
            exit 1
          fi
      - name: Validate macOS community packages
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          npm run validate:release -- --version "$version" --platform macos dist

      - name: Upload macOS community artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SideKick-macOS-arm64
          path: |
            dist/SideKick-*-macos-arm64.dmg
            dist/SideKick-*-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 libgbm1 \
            libgtk-3-0 libnotify4 libnss3 libx11-xcb1 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libxss1 libxtst6 xdg-utils xvfb
      - run: npm ci
      - name: Verify stable tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tagged releases require stable semver; received $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Expected tag v$version, received $GITHUB_REF_NAME"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run test:docs
      - run: npm test
      - run: npm run test:release
      - name: Build Linux AppImage
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:linux
      - run: xvfb-run --auto-servernum npm run test:e2e:runtime
        env:
          SIDEKICK_E2E_EXECUTABLE: dist/linux-unpacked/io.github.eponce00.sidekick
      - run: xvfb-run --auto-servernum npm run test:native-browser-smoke
      - run: xvfb-run --auto-servernum npm run test:native-browser-fixtures
      - run: npm run validate:package -- dist/linux-unpacked/resources
      - name: Validate final Linux AppImage structure and identity
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(dist/SideKick-*-linux-x64.AppImage)
          if (( ${#appimages[@]} != 1 )); then
            echo "::error::Expected exactly one Linux x64 AppImage."
            exit 1
          fi
          npm run validate:linux-appimage -- "${appimages[0]}"
      - name: Smoke-test the final Linux AppImage
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(dist/SideKick-*-linux-x64.AppImage)
          xvfb-run --auto-servernum npm run smoke:packaged:linux -- "${appimages[0]}"
      - name: Validate Linux community package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          npm run validate:release -- --version "$version" --platform linux dist

      - name: Upload Linux community artifact
        uses: actions/upload-artifact@v7
        with:
          name: SideKick-Linux-x64
          path: dist/SideKick-*-linux-x64.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified community release
    if: github.ref_type == 'tag'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - run: npm ci
      - name: Download validated platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: SideKick-*
          path: release-artifacts
          merge-multiple: true

      - name: Validate the complete release and generate checksums
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          npm run validate:release -- --version "$version" --platform all --write-checksums release-artifacts

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-checksums: release-artifacts/SHA256SUMS.txt

      - name: Verify the public release destination and immutable source tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')"
          if [[ "$visibility" != 'public' ]]; then
            echo "::error::$GITHUB_REPOSITORY must be public for transparent community releases and attestations."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; community releases are never overwritten."
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$checkout_commit" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME resolves to $tag_commit, expected checked-out commit $checkout_commit."
            exit 1
          fi

      - name: Create a draft release and upload the immutable asset set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGNED: ${{ github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$WINDOWS_SIGNED" = 'true' ]; then
            windows_trust='The Windows installer is signed by SignPath Foundation, which provides free code signing to open-source projects.'
          else
            windows_trust='The Windows installer is unsigned.'
          fi
          cat > release-notes.md <<EOF
          Free SideKick community packages built from \`$GITHUB_REPOSITORY@$GITHUB_SHA\`.

          Read the [version changelog](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md) for changes and migration notes.

          ## Updating

          Install the current package over an existing SideKick installation; application data remains in the platform user-data directory. Releases from 0.7.1 onward can download verified updates and offer an app-only **Restart and update** action on Windows and Apple Silicon macOS. OS approval prompts can remain; macOS needs a writable installation folder outside the DMG. Linux reveals a verified AppImage for manual replacement. Real installed upgrades and Mac permission prompts still require device qualification.

          ## Downloads

          | Operating system | Architecture | Recommended package | Alternative |
          | --- | --- | --- | --- |
          | macOS | Apple Silicon (arm64) | \`SideKick-${version}-macos-arm64.dmg\` | \`SideKick-${version}-macos-arm64.zip\` |
          | Windows | x64 | \`SideKick-${version}-windows-x64-setup.exe\` | — |
          | Linux | x64 | \`SideKick-${version}-linux-x64.AppImage\` | — |

          ## Trust

          The macOS packages are ad-hoc signed and not notarized. $windows_trust Linux uses a self-contained AppImage and does not require a paid signing service. Verify \`SHA256SUMS.txt\` and the GitHub artifact attestation before installing. Read the [code signing policy](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/development/CODE_SIGNING.md).
          EOF
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "SideKick $GITHUB_REF_NAME" \
            --notes-file release-notes.md

      - name: Verify the uploaded draft before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          is_prerelease="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
          [[ "$is_draft" == 'true' ]]
          [[ "$is_prerelease" == 'false' ]]

          mapfile -t local_assets < <(find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t remote_assets < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          if [[ "${local_assets[*]}" != "${remote_assets[*]}" ]]; then
            echo "::error::Uploaded assets do not match the locally validated artifact set."
            printf 'Local: %s\nRemote: %s\n' "${local_assets[*]}" "${remote_assets[*]}"
            exit 1
          fi

          while IFS=$'\t' read -r name size; do
            if [[ -z "$name" || "$size" -le 0 ]]; then
              echo "::error::Remote release contains an empty asset: $name"
              exit 1
            fi
            local_size="$(stat -c '%s' "release-artifacts/$name")"
            if [[ "$size" -ne "$local_size" ]]; then
              echo "::error::Remote size for $name is $size; expected $local_size."
              exit 1
            fi
          done < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name, .size] | @tsv')

      - name: Publish the verified community release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          is_prerelease="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
          [[ "$is_draft" == 'false' ]]
          [[ "$is_prerelease" == 'false' ]]
