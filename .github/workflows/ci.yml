name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes its running checks moot.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Platform-independent checks run once. Coverage is measured here, where it is cheapest.
  checks:
    name: Checks (Linux x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run test:docs
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high

  # The suite on the other platforms. Windows runs it on one worker (see scripts/run-vitest.cjs),
  # so it is split across two machines instead.
  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64, 1 of 2
            os: windows-latest
            shard: 1/2
          - name: Windows x64, 2 of 2
            os: windows-latest
            shard: 2/2
          - name: macOS arm64
            os: macos-14
            shard: 1/1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: npm test -- --shard=${{ matrix.shard }}

  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            smoke: windows
            executable: dist/win-unpacked/SideKick.exe
          - name: macOS arm64
            os: macos-14
            smoke: macos
            executable: dist/mac-arm64/SideKick.app/Contents/MacOS/SideKick
          - name: Linux x64
            os: ubuntu-22.04
            smoke: linux
            executable: dist/linux-unpacked/io.github.eponce00.sidekick
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        id: prepare

      # electron-builder downloads the Electron release it packages on every run otherwise.
      - name: Restore Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.dependencies-hash }}

      - run: npm run test:release
      - name: Check packaged PDF runner contracts
        run: node --test scripts/electron-packaged-pdf-readonly.contract.test.cjs scripts/electron-packaged-pdf-save.contract.test.cjs scripts/run-publication-directory-linux.test.cjs
      - run: npm run build:unpack
      - name: Run packaged real-Electron journey
        if: matrix.smoke != 'linux'
        run: npm run test:e2e:runtime
        env:
          SIDEKICK_E2E_EXECUTABLE: ${{ matrix.executable }}
      - name: Run packaged real-Electron journey on Linux
        if: matrix.smoke == 'linux'
        run: xvfb-run --auto-servernum npm run test:e2e:runtime
        env:
          SIDEKICK_E2E_EXECUTABLE: ${{ matrix.executable }}
      - name: Smoke-test native browser tools
        if: matrix.smoke != 'linux'
        run: npm run test:native-browser-smoke
      - name: Smoke-test native browser tools on Linux
        if: matrix.smoke == 'linux'
        run: xvfb-run --auto-servernum npm run test:native-browser-smoke
      - name: Verify native browser form recovery and saved PDF fixtures
        if: matrix.smoke != 'linux'
        run: npm run test:native-browser-fixtures
      - name: Verify native browser fixtures on Linux
        if: matrix.smoke == 'linux'
        run: xvfb-run --auto-servernum npm run test:native-browser-fixtures
      - name: Audit Windows packaged content
        if: matrix.smoke == 'windows'
        run: npm run validate:package -- dist/win-unpacked/resources
      - name: Audit macOS packaged content
        if: matrix.smoke == 'macos'
        run: npm run validate:package -- dist/mac-arm64/SideKick.app/Contents/Resources
      - name: Audit Linux packaged content
        if: matrix.smoke == 'linux'
        run: npm run validate:package -- dist/linux-unpacked/resources
      - name: Smoke-test Windows package
        if: matrix.smoke == 'windows'
        run: npm run smoke:packaged:windows
      - name: Smoke-test macOS package
        if: matrix.smoke == 'macos'
        run: npm run smoke:packaged:macos
        env:
          SIDEKICK_ALLOW_UNSIGNED_SMOKE: ${{ github.event_name == 'pull_request' }}
      - name: Smoke-test Linux package
        if: matrix.smoke == 'linux'
        run: xvfb-run --auto-servernum npm run smoke:packaged:linux

  # The checks branch protection requires. Each passes only when every job above passed, so a
  # failure anywhere blocks a merge. A skipped job would count as passing, hence `always()`.
  validate:
    name: Validate (${{ matrix.name }})
    needs: [checks, tests, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        name: [Windows x64, macOS arm64, Linux x64]
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Checks, tests, package: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
