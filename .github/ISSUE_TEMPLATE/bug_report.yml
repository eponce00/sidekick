name: Bug report
description: Report a reproducible SideKick problem
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SideKick. Never include credentials, private prompts, personal files, or unredacted screenshots. Report security issues privately through the link below instead.
  - type: input
    id: version
    attributes:
      label: SideKick version
      description: Find this in Settings → General.
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS arm64
        - Windows x64
        - Unsupported or development environment
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior without including private data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optionally attach the metadata-only export from Settings → General → Support after reviewing it.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and its attachments for credentials and personal information.
          required: true
