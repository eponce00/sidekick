name: Feature request
description: Propose a focused improvement to SideKick
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should SideKick solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful interaction or outcome.
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: Privacy, permissions, and external services
      description: Note any new data flow, credential, filesystem, command, connector, or network access involved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional; explain current workarounds or simpler options.
